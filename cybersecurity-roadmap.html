<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybersecurity Roadmap</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');

  :root {
    --bg: #080c10;
    --panel: #0d1117;
    --border: #1c2a3a;
    --green: #00ff88;
    --cyan: #00d4ff;
    --yellow: #ffd700;
    --red: #ff4455;
    --orange: #ff8c00;
    --text: #c9d1d9;
    --muted: #4a5568;
    --glow-green: 0 0 12px rgba(0,255,136,0.4);
    --glow-cyan: 0 0 12px rgba(0,212,255,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.08) 3px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  .title {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(22px, 5vw, 38px);
    color: var(--green);
    text-shadow: var(--glow-green);
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .subtitle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 3px;
    margin-top: 6px;
  }

  .blink {
    animation: blink 1.2s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Progress bar */
  .global-progress {
    max-width: 720px;
    margin: 0 auto 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px 18px;
  }
  .progress-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--cyan);
    letter-spacing: 2px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  .bar-track {
    background: #111;
    border-radius: 2px;
    height: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--cyan));
    border-radius: 2px;
    transition: width 0.5s ease;
    box-shadow: var(--glow-green);
  }

  /* Phase cards */
  .phase {
    max-width: 720px;
    margin: 0 auto 20px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .phase.active { border-color: var(--green); }
  .phase.locked { opacity: 0.55; }

  .phase-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  .phase-header:hover { background: rgba(255,255,255,0.02); }

  .phase-num {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .phase-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    flex: 1;
  }

  .phase-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 2px;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .badge-foundational { background: rgba(0,255,136,0.12); color: var(--green); border: 1px solid rgba(0,255,136,0.3); }
  .badge-intermediate { background: rgba(0,212,255,0.12); color: var(--cyan); border: 1px solid rgba(0,212,255,0.3); }
  .badge-advanced { background: rgba(255,140,0,0.12); color: var(--orange); border: 1px solid rgba(255,140,0,0.3); }
  .badge-elite { background: rgba(255,68,85,0.12); color: var(--red); border: 1px solid rgba(255,68,85,0.3); }

  .phase-duration {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }

  .chevron {
    font-size: 12px;
    color: var(--muted);
    transition: transform 0.3s;
  }
  .open .chevron { transform: rotate(90deg); }

  .phase-body {
    display: none;
    padding: 0 18px 18px;
    border-top: 1px solid var(--border);
  }
  .phase-body.visible { display: block; }

  .phase-desc {
    font-size: 14px;
    color: #8b9ab0;
    margin: 14px 0 16px;
    padding-left: 10px;
    border-left: 2px solid var(--border);
  }

  /* Topics */
  .topic-section { margin-bottom: 18px; }
  .topic-section-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .topic-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 3px;
    margin-bottom: 4px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .topic-item:hover { background: rgba(255,255,255,0.03); }
  .topic-item.done { opacity: 0.5; }

  .topic-check {
    width: 16px;
    height: 16px;
    border: 1px solid var(--border);
    border-radius: 2px;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    transition: all 0.2s;
  }
  .topic-item.done .topic-check {
    background: var(--green);
    border-color: var(--green);
    color: #000;
    box-shadow: var(--glow-green);
  }

  .topic-text { flex: 1; font-size: 14px; }
  .topic-name { font-weight: 600; color: var(--text); }
  .topic-detail { font-size: 12px; color: #5a6a7a; margin-top: 2px; }

  /* Resources */
  .resources {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 14px;
    margin-top: 14px;
  }
  .resources-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--cyan);
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .resource-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .resource-tag {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .tag-free { background: rgba(0,255,136,0.1); color: var(--green); }
  .tag-paid { background: rgba(255,68,85,0.1); color: var(--red); }
  .tag-cert { background: rgba(255,215,0,0.1); color: var(--yellow); }
  .tag-lab { background: rgba(0,212,255,0.1); color: var(--cyan); }

  .milestone {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding: 10px 12px;
    background: rgba(255,215,0,0.05);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 3px;
    font-size: 13px;
    color: var(--yellow);
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.5px;
  }

  footer {
    max-width: 720px;
    margin: 32px auto 0;
    text-align: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
  }
</style>
</head>

function saveState() {
  const checked = {};
  document.querySelectorAll('.topic-item').forEach(el => {
    if (el.classList.contains('done')) checked[el.dataset.id] = true;
  });
  localStorage.setItem('cyberRoadmap', JSON.stringify(checked));
}

function loadState() {
  try { return JSON.parse(localStorage.getItem('cyberRoadmap')) || {}; } catch { return {}; }
}

function updateProgress() {
  const all = document.querySelectorAll('.topic-item');
  const done = document.querySelectorAll('.topic-item.done');
  const pct = all.length ? Math.round((done.length / all.length) * 100) : 0;
  document.getElementById('global-bar').style.width = pct + '%';
  document.getElementById('pct-label').textContent = pct + '%';
}

function render() {
  const state = loadState();
  const container = document.getElementById('roadmap');

  phases.forEach((phase, pi) => {
    const phaseEl = document.createElement('div');
    phaseEl.className = 'phase';
    phaseEl.id = phase.id;

    let topicsHTML = '';
    let topicIdx = 0;
    phase.sections.forEach(sec => {
      let itemsHTML = '';
      sec.topics.forEach(t => {
        const id = `${phase.id}-${topicIdx++}`;
        const done = state[id] ? 'done' : '';
        itemsHTML += `
          <div class="topic-item ${done}" data-id="${id}">
            <div class="topic-check">${done ? '✓' : ''}</div>
            <div class="topic-text">
              <div class="topic-name">${t.name}</div>
              <div class="topic-detail">${t.detail}</div>
            </div>
          </div>`;
      });
      topicsHTML += `
        <div class="topic-section">
          <div class="topic-section-title">${sec.title}</div>
          ${itemsHTML}
        </div>`;
    });

    const resHTML = phase.resources.map(r =>
      `<div class="resource-item"><span class="resource-tag ${r.cls}">${r.tag}</span>${r.text}</div>`
    ).join('');

    phaseEl.innerHTML = `
      <div class="phase-header">
        <span class="phase-num">${phase.num}</span>
        <span class="phase-title">${phase.title}</span>
        <span class="phase-badge ${phase.badgeClass}">${phase.badge}</span>
        <span class="phase-duration">${phase.duration}</span>
        <span class="chevron">▶</span>
      </div>
      <div class="phase-body">
        <div class="phase-desc">${phase.desc}</div>
        ${topicsHTML}
        <div class="resources">
          <div class="resources-title">// RESOURCES & CERTS</div>
          ${resHTML}
        </div>
        <div class="milestone">${phase.milestone}</div>
      </div>`;

    container.appendChild(phaseEl);

    // Toggle
    phaseEl.querySelector('.phase-header').addEventListener('click', () => {
      const body = phaseEl.querySelector('.phase-body');
      const hdr = phaseEl.querySelector('.phase-header');
      body.classList.toggle('visible');
      hdr.classList.toggle('open');
      phaseEl.classList.toggle('active');
    });

    // Topic clicks
    phaseEl.querySelectorAll('.topic-item').forEach(item => {
      item.addEventListener('click', () => {
        const isDone = item.classList.toggle('done');
        item.querySelector('.topic-check').textContent = isDone ? '✓' : '';
        saveState();
        updateProgress();
      });
    });
  });

  updateProgress();
}

render();
</script>
</body>
</html>
